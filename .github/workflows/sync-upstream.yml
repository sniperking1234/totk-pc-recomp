name: Sync upstream branches

on:
  schedule:
    - cron: "30 18 * * *"   # 每天 UTC 18:30（北京时间次日凌晨 2:30）运行
  workflow_dispatch: {}      # 也支持在 Actions 页面手动触发

concurrency:
  group: sync-upstream
  cancel-in-progress: false

# 内置 GITHUB_TOKEN 需要 Contents 写权限：下方"两步镜像"的第一步用它
# 推送分支/tag（它创建的推送事件永远不会触发任何 workflow）。
permissions:
  contents: write

jobs:
  sync:
    # 防止这个文件哪天被合进上游后、在上游仓库里误跑
    if: github.repository_owner != 'valentderah'
    runs-on: ubuntu-latest
    # 首跑要搬运 14 个 release 共约 4.85 GB 附件（增量式，超时会续跑补齐）；
    # 日常运行 1~3 分钟量级
    timeout-minutes: 350
    steps:
      # 关键：用带 Workflows 写权限的 PAT 检出并推送。
      # 内置 GITHUB_TOKEN 是 GitHub App token，GitHub 安全策略禁止它推送任何
      # 会创建/修改 .github/workflows/ 的提交——而下方"放回"步骤每次都会产生
      # 这样的提交、PAT 补推步骤也依赖 PAT，所以检出必须用 secret SYNC_TOKEN。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 必须拉全量历史，否则推送不了
          token: ${{ secrets.SYNC_TOKEN }}

      # main 会被镜像成上游版本，这个文件自己会"消失"，所以先备份
      - name: Back up this workflow file
        run: cp .github/workflows/sync-upstream.yml "$RUNNER_TEMP/sync.yml"

      - name: Fetch upstream
        run: |
          git remote -v | grep -q upstream || \
            git remote add upstream https://github.com/valentderah/totk-pc-recomp.git
          # 分支和 tag 一次取齐：之后的任何 push 前都不再 fetch——任何 fetch
          # 都会重建 refs/remotes/upstream/HEAD 符号引用，它会被 refspec 通配符
          # 匹配到、生成一个叫 HEAD 的垃圾分支；负向 refspec 挡不住它，
          # 所以取完一次性删掉这个 symref 再开始推送（踩坑 2）
          #
          # --force 必须：上游可能把已发布的 tag 挪到别的提交。不带 --force
          # 的 fetch 报 "! [rejected] <tag> (would clobber existing tag)" 并
          # exit 1（AnyPS5 2026-10-29 踩过，定时任务"自杀"停摆两天，踩坑 10）
          git fetch --prune --tags --force upstream
          git remote set-head upstream --delete

      # 两步镜像，避免触发上游继承来的 on:push CI。上游 main 上只有 1 个
      # workflow（content-guard，on: push + pull_request 无分支过滤，部署时已以
      # stub 预创建并禁用，镜像把真实内容覆盖进来条目仍保持 disabled_manually
      #（踩坑 11）；每晚 keep-workflow 提交的 PAT 推送全靠这个禁用条目拦住：
      #   1) 先用内置 GITHUB_TOKEN 推：App token 产生的推送事件永不触发任何
      #      workflow（官方防递归行为）——旧版全程用 PAT 推送会每晚触发上游 CI
      #   2) GITHUB_TOKEN 无 Workflows 权限，包含 .github/workflows 改动的 ref
      #      会被拒绝（防提权）——届时已成功推上去的 ref 变为"up to date"，
      #      第 2 步 PAT 重推只补剩下的 ref
      # 上游注册表另有 amiibo-tests / linux-host / macos / windows-host 四个
      # 幽灵条目（PR ref 来源，不在任何分支/tag 树里，全部 tag 树均只含
      # content-guard.yml）——fork 注册表不带它们，万一哪天合入 main，
      # 按 README 踩坑 11 的"幽灵条目合入"预案处置（一次性触发，禁用即可）
      - name: Mirror all upstream branches (built-in token, no CI triggered)
        env:
          APP_TOKEN: ${{ github.token }}
        run: |
          git push --force "https://x-access-token:${APP_TOKEN}@github.com/$GITHUB_REPOSITORY.git" \
            'refs/remotes/upstream/*:refs/heads/*' || echo "(部分 ref 需 PAT 补推)"

      - name: Mirror all upstream tags (built-in token, no CI triggered)
        env:
          APP_TOKEN: ${{ github.token }}
        run: |
          # tag 已在 Fetch upstream 步骤取齐，这里只推不取；
          # 上游 re-tag 过的 tag 靠 --force 覆盖 fork 上的旧值
          git push --force "https://x-access-token:${APP_TOKEN}@github.com/$GITHUB_REPOSITORY.git" \
            --tags || echo "(部分 tag 需 PAT 补推)"

      # 第 2 步：PAT 补推内置 token 被拒的 ref（已推成功的是 up to date，自动跳过）。
      # 同步所有 tag；只加不删——上游删掉的 tag 会留在 fork 上
      #（tag 很少被删，一般无影响）
      - name: Finish branch/tag mirror with PAT
        run: |
          git push --force origin 'refs/remotes/upstream/*:refs/heads/*'
          git push --force origin --tags

      # 镜像上游 release（说明文字 + 二进制附件）。只做增量：已存在的 release
      # 不重建，仅补缺失资产、同步更新的正文。上游（2026-11-19 部署时）14 个
      # release、约 4.85 GB 附件（TotK-Setup windows.zip / x86_64 AppImage），
      # 首跑约 10 分钟搬完，之后每晚增量秒过。
      # 双 token：读上游用内置 GITHUB_TOKEN（公开仓库只读没问题，但无写权限），
      # 写 fork 用 SYNC_TOKEN（细粒度 PAT，Contents 写权限）。
      - name: Mirror upstream releases into this fork
        env:
          UP_TOKEN: ${{ github.token }}          # 只读上游（公开仓库）
          FORK_TOKEN: ${{ secrets.SYNC_TOKEN }}   # 写入本 fork
        run: |
          UPSTREAM=valentderah/totk-pc-recomp
          FORK="$GITHUB_REPOSITORY"
          DIR="$RUNNER_TEMP/relmirror"
          mkdir -p "$DIR"

          up()   { GH_TOKEN="$UP_TOKEN"   gh "$@" --repo "$UPSTREAM"; }
          mine() { GH_TOKEN="$FORK_TOKEN" gh "$@" --repo "$FORK"; }

          # 上游 release 的 tag，从旧到新（fork 上 Latest 徽章落在最新版）
          mapfile -t tags < <(up release list --limit 100 --json tagName --jq '.[].tagName' | tac)

          for tag in "${tags[@]}"; do
            echo "== release $tag"
            fork_json=$(mine release view "$tag" --json body,assets 2>/dev/null || true)
            if [[ -z "$fork_json" ]]; then
              name=$(up release view "$tag" --json name --jq .name)
              is_pre=$(up release view "$tag" --json isPrerelease --jq .isPrerelease)
              up release view "$tag" --json body --jq .body > "$DIR/body.md"
              args=(--title "$name" --notes-file "$DIR/body.md" --verify-tag)
              [[ "$is_pre" == "true" ]] && args+=(--prerelease)
              mine release create "$tag" "${args[@]}"
              fork_json=$(mine release view "$tag" --json body,assets)
            else
              # 正文与上游不同则更新
              up release view "$tag" --json body --jq .body > "$DIR/body.md"
              if [[ "$(jq -r .body <<<"$fork_json")" != "$(cat "$DIR/body.md")" ]]; then
                mine release edit "$tag" --notes-file "$DIR/body.md" >/dev/null
              fi
            fi

            # 补缺失的资产。单附件失败仅告警、下次运行自动补齐（eden 先例）；
            # 下载先就地重试 3 次：上游 asset API 偶发瞬时 500 会把整个 run 打死
            #（2026-11-09 Hookshot 首跑踩过：搬到 31/44 个 release 时
            #  releases/assets/<id> 一次 HTTP 500，放回步骤连带被跳过）
            mapfile -t have < <(jq -r '.assets[].name' <<<"$fork_json")
            for a in $(up release view "$tag" --json assets --jq '.assets[].name'); do
              if printf '%s\n' "${have[@]}" | grep -qx "$a"; then continue; fi
              echo "  asset $tag/$a：下载并上传"
              ok=0
              for attempt in 1 2 3; do
                if up release download "$tag" --pattern "$a" --dir "$DIR" --clobber; then ok=1; break; fi
                echo "  !! 下载失败（第 $attempt 次），10 秒后重试..."
                sleep 10
              done
              if [[ "$ok" -ne 1 ]]; then
                echo "  !! 下载 3 次均失败，跳过该附件（下次运行自动补齐）"
                continue
              fi
              if ! mine release upload "$tag" "$DIR/$a" --clobber; then
                echo "  !! 上传失败，跳过（下次运行自动补齐）"
              fi
              rm -f "$DIR/$a"
            done
          done

      # 镜像必然覆盖默认分支 main——把 workflow 文件放回并提交推送
      #（否则 main 被镜像后文件消失，定时任务会"自杀"）
      # mkdir -p 兜底上游分支不存在 .github/workflows 目录的情况
      #（bloodborne_pc 踩过，见 README 踩坑 5）
      - name: Put this workflow back on main
        run: |
          git checkout -f -B main upstream/main
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/sync.yml" .github/workflows/sync-upstream.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sync-upstream.yml
          git commit -m "chore: keep fork-sync workflow"
          # 放回推送加 3 次重试：GitHub 偶发无理由拒绝这次推送
          #（nxnative 2026-11-04 踩过：! [remote rejected] main -> main (failed)，
          #  无重试的放回失败 = main 上没有 workflow 文件 = 条目被删 =
          #  定时任务死亡 6 天；见 README 踩坑 13）
          ok=0
          for attempt in 1 2 3; do
            if git push origin main; then ok=1; break; fi
            echo "!! 放回推送被拒（第 $attempt 次），15 秒后重试..."
            sleep 15
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "!! 3 次均失败——定时任务已死，需手动重 PUT workflow（README 修改 workflow 的流程）"
            exit 1
          fi
